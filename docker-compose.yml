services:
  postgres:
    image: postgres:17-alpine
    container_name: drivepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drivepulse
      POSTGRES_PASSWORD: drivepulse_dev_password
      POSTGRES_DB: drivepulse
    ports:
      - "5433:5432"
    volumes:
      - drivepulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U drivepulse -d drivepulse"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: drivepulse-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/mosquitto/data:/mosquitto/data
      - ./infrastructure/mosquitto/log:/mosquitto/log

volumes:
  drivepulse_postgres_data:
